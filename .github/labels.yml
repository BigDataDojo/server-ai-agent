# リポジトリで使うラベルの定義。
# main にマージされると .github/workflows/labels-sync.yml が GitHub に反映する（ここにないラベルは消さない）。

# --- 種類 ---
- { name: "type:decision", color: "5319e7", description: "今週の問い（設計で決めること。決定記録の PR で答える）" }
- { name: "type:question", color: "d876e3", description: "質問・相談" }
- { name: "type:task",     color: "0e8a16", description: "具体的な作業" }
- { name: "type:idea",     color: "a2eeef", description: "アイデア・機能提案" }
- { name: "type:bug",      color: "d73a4a", description: "エージェントの不具合・誤動作" }
- { name: "type:incident", color: "b60205", description: "障害事例・ナレッジ（評価データや知識ベースの材料）" }

# --- コース ---
- { name: "course:a",   color: "7e57c2", description: "コース A：ローカルLLM" }
- { name: "course:b",   color: "ef6c00", description: "コース B：インフラ／Claude エージェント" }
- { name: "course:c",   color: "2e7d32", description: "コース C：共通基盤" }
- { name: "course:all", color: "546e7a", description: "全体・複数コースにまたがる" }

# --- 章（design/ のフォルダに対応） ---
- { name: "area:overview",     color: "c5def5", description: "design/00-overview 全体像" }
- { name: "area:infra",        color: "c5def5", description: "design/01-infra 研究室のインフラ" }
- { name: "area:common",       color: "c5def5", description: "design/10-common 共通基盤" }
- { name: "area:eval-data",    color: "c5def5", description: "design/20-local-llm/1-eval-data 評価データ" }
- { name: "area:retrieval",    color: "c5def5", description: "design/20-local-llm/2-retrieval 検索" }
- { name: "area:generation",   color: "c5def5", description: "design/20-local-llm/3-generation 回答生成" }
- { name: "area:slack-eval",   color: "c5def5", description: "design/20-local-llm/4-slack-eval Slack 連携と評価" }
- { name: "area:claude-agent", color: "c5def5", description: "design/30-claude-agent Claude エージェント" }
- { name: "area:interfaces",   color: "c5def5", description: "design/interfaces 入出力の契約" }

# --- 権限レベル（design/00-overview の L0〜L3） ---
- { name: "level:L0", color: "e6f4ea", description: "閲覧（状態確認、ログ参照）" }
- { name: "level:L1", color: "fef2c0", description: "安全な操作（許可リスト内）" }
- { name: "level:L2", color: "fbca04", description: "作成・設定変更（承認必須）" }
- { name: "level:L3", color: "e99695", description: "削除・根幹の設定" }

# --- 状態 ---
- { name: "status:triage",     color: "ededed", description: "未整理" }
- { name: "status:discussion", color: "bfd4f2", description: "議論中" }
- { name: "status:blocked",    color: "000000", description: "他の決定・作業待ち" }

# --- その他 ---
- { name: "good first issue", color: "7057ff", description: "取り組みやすい" }
- { name: "help wanted",      color: "008672", description: "意見・協力がほしい" }
- { name: "guard",            color: "b60205", description: "PR を通さない main への変更（自動で作られる）" }
