name: 🧭 設計判断の議論
description: 技術選定や方針など、決める必要があることを議論する（決定後は ADR にする）
title: "[Decision] "
labels: ["type:decision", "status:discussion"]
body:
  - type: markdown
    attributes:
      value: |
        結論が出たら `docs/adr/` に ADR を作成し、この Issue をリンクして閉じます。
  - type: textarea
    id: background
    attributes:
      label: 背景・決めたいこと
      placeholder: 例）ローカル推論基盤を何にするか決めたい
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 選択肢
      description: 候補と、それぞれの長所・短所
      value: |
        1. 案 A
           - 長所:
           - 短所:
        2. 案 B
           - 長所:
           - 短所:
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: 判断基準・制約
      placeholder: 例）GPU なしでも動くこと、日本語の精度、メンテの手間
  - type: textarea
    id: proposal
    attributes:
      label: 現時点の推し案（あれば）
  - type: input
    id: deadline
    attributes:
      label: いつまでに決めたいか
