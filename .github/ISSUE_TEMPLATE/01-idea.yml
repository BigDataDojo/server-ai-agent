name: 💡 アイデア・機能提案
description: エージェントにやらせたいこと、あったら便利な機能を提案する
title: "[Idea] "
labels: ["type:idea", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        思いつきレベルで OK です。決まっていない項目は空欄のままで構いません。
  - type: dropdown
    id: area
    attributes:
      label: 領域
      multiple: true
      options:
        - 共通基盤（Slack の受付・振り分け）
        - ローカルLLM エージェント
        - Claude エージェント
        - 研究室のインフラ
        - 安全・権限
        - その他
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: やらせたいこと
      description: エージェントに何をしてほしいか
      placeholder: 例）証明書の期限が近いサービスを毎朝 Slack に知らせてほしい
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: なぜ必要か・困っていること
  - type: dropdown
    id: risk
    attributes:
      label: 必要な権限レベル（想定）
      description: 判断できなければ「わからない」で OK
      options:
        - "L0: 閲覧（状態確認、ログ参照）"
        - "L1: 安全な操作（サービス再起動など）"
        - "L2: 作成・設定変更（承認必須）"
        - "L3: 削除・根幹の設定"
        - わからない
  - type: dropdown
    id: model
    attributes:
      label: 処理するモデル（想定）
      options:
        - ローカルで十分そう
        - API が必要そう
        - 機密情報を含むのでローカル限定
        - わからない
  - type: textarea
    id: notes
    attributes:
      label: 補足・参考リンク
