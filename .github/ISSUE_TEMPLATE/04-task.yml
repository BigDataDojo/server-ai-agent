name: ✅ タスク
description: ロードマップ上の具体的な作業
title: "[Task] "
labels: ["type:task"]
body:
  - type: dropdown
    id: phase
    attributes:
      label: フェーズ
      description: docs/roadmap.md のどの段階か
      options:
        - "Phase 0: 構想整理"
        - "Phase 1: 観察者（読み取り専用）"
        - "Phase 2: 助言者（提案まで）"
        - "Phase 3: 実行者（承認制）"
        - "Phase 4: 自律運用"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: やること
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完了条件
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: 関連 Issue・依存関係
      placeholder: 例）#12 が終わってから
